# Smart Mini Greenhouse Control System - Configuration File
# This file contains system-wide settings for Arduino communication,
# logging, and UI parameters.

[Arduino]
# Serial port for Arduino connection
# Linux: typically /dev/ttyACM0 or /dev/ttyUSB0
# Windows: typically COM3, COM4, etc.
# macOS: typically /dev/cu.usbmodem*
port = /dev/ttyACM0

# Baud rate must match Arduino firmware (9600)
baud_rate = 9600

# Serial timeout in seconds
timeout = 2.0

# Reconnection attempts if connection is lost
reconnect_attempts = 5

# Delay between reconnection attempts (seconds)
reconnect_delay = 2.0

[Simulation]
# Simulation time step in seconds
# Smaller values = more accurate but slower
# Recommended: 0.1 to 1.0
time_step = 0.1

# Initial environmental conditions
ambient_temperature = 20.0  # °C
initial_greenhouse_temp = 22.0  # °C
initial_moisture = 50.0  # %
initial_humidity = 60.0  # %

# Enable/disable simulation mode
# If true, runs without Arduino (uses simulated data only)
simulation_only = false

[Logging]
# Directory for CSV log files
log_dir = ./data/logs

# SQLite database path
database = ./data/greenhouse.db

# Logging interval in seconds
log_interval = 1.0

# Maximum log file size before rotation (MB)
max_log_size_mb = 100

# Number of rotated log files to keep
max_log_files = 10

# Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
log_level = INFO

[UI]
# Streamlit UI refresh rate in seconds
refresh_rate = 1.0

# Number of seconds of data to show in charts
chart_history_seconds = 300

# Chart update mode: 'live' or 'batch'
# live = updates every refresh, batch = updates on demand
chart_mode = live

# Enable dark theme
dark_theme = false

# Show advanced controls by default
show_advanced = false

# Temperature display unit: 'C' or 'F'
temp_unit = C

[Control]
# Default control mode on startup
# Options: MANUAL, OPEN_LOOP, CLOSED_LOOP, FEEDFORWARD, PID
default_mode = MANUAL

# Default temperature setpoint (°C)
default_temp_setpoint = 24.0

# Default moisture setpoint (%)
default_moisture_setpoint = 50.0

# PID controller default parameters (will be tuned during operation)
# Temperature PID
pid_temp_kp = 1.0
pid_temp_ki = 0.1
pid_temp_kd = 0.05

# Moisture PID
pid_moisture_kp = 0.8
pid_moisture_ki = 0.05
pid_moisture_kd = 0.02

[Safety]
# Enable safety limits
safety_enabled = true

# Temperature limits (°C)
max_temperature = 45.0
min_temperature = 5.0

# Moisture limits (%)
max_moisture = 95.0
min_moisture = 5.0

# Maximum fan runtime (seconds, 0 = unlimited)
max_fan_runtime = 0

# Maximum heater runtime (seconds)
max_heater_runtime = 3600

# Maximum pump runtime (seconds)
max_pump_runtime = 30

# Enable emergency stop on sensor failure
emergency_stop_on_failure = true
